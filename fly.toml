# Fly.io – støtter vedvarende WebSocket-tilkoblinger.
# Oppsett: se docs/PUBLISERING.md
app = "podiepanikk"
primary_region = "arn"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"   # rom lever i minnet – ikke stopp maskinen midt i et spill
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1500

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
