# Lokal produksjonslik kjøring: app + PostgreSQL.
#   docker compose up --build
# Åpne http://localhost:3001
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: podiepanikk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytt-meg-lokalt}
      POSTGRES_DB: podiepanikk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U podiepanikk']
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://podiepanikk:${POSTGRES_PASSWORD:-bytt-meg-lokalt}@db:5432/podiepanikk
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Sett ADMIN_PASSWORD (minst 12 tegn) i .env}
      TRUST_PROXY: 'false'
      ALLOW_BOTS: 'true'

volumes:
  pgdata:
